[project]
name = "momentliving-ai-py"
version = "0.1.0"
description = "一刻生活 AI 助手服务（FastAPI + LangChain 重构 Spring AI 版，接口契约与 Spring 版零改动）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-core>=1.0",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    "nacos-sdk-python>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pymysql>=1.1",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "tenacity>=8.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
